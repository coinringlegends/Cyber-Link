name: Build APK & Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (matches gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to docs/downloads and sync metadata
        run: |
          mkdir -p docs/downloads
          cp app/build/outputs/apk/debug/app-debug.apk docs/downloads/cyber-link-app.apk
          SHA=$(sha256sum docs/downloads/cyber-link-app.apk | awk '{print $1}')
          BYTES=$(wc -c < docs/downloads/cyber-link-app.apk | tr -d ' ')
          echo "Built APK: ${BYTES} bytes, SHA-256: ${SHA}"
          sed -i -E "s|<code class=\"sha\" id=\"apkSha\">[a-f0-9]+</code>|<code class=\"sha\" id=\"apkSha\">${SHA}</code>|" docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
